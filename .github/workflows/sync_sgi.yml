name: Sincronizar vendas do SGI

on:
  schedule:
    # Brasília não observa horário de verão (fixo em UTC-3) -> de hora em hora, das
    # 8h às 19h BRT = 11h às 22h UTC. (O GitHub pode atrasar alguns minutos.)
    - cron: "5 11-22 * * *"
  workflow_dispatch:
    inputs:
      loja:
        description: "Rodar só uma loja (deixe em branco para todas as configuradas)"
        required: false
        type: choice
        options:
          - ""
          - "Porteira"
          - "Casa de Adubo"
      data:
        description: "Data específica DD/MM/AAAA (deixe em branco para hoje)"
        required: false
        type: string
      data_fim:
        description: "Data final DD/MM/AAAA: reprocessa dia a dia de 'data' até aqui (para corrigir o histórico líquido)"
        required: false
        type: string

# Evita duas sincronizações simultâneas gravando nas mesmas linhas.
concurrency:
  group: sync-sgi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements-sync.txt
          playwright install --with-deps chromium

      - name: Rodar sincronização
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SGI_URL_LOGIN: ${{ secrets.SGI_URL_LOGIN }}
          SGI_LOGIN: ${{ secrets.SGI_LOGIN }}
          SGI_SENHA: ${{ secrets.SGI_SENHA }}
          SGI_EMPRESA_PORTEIRA: ${{ secrets.SGI_EMPRESA_PORTEIRA }}
          SGI_EMPRESA_CASA_ADUBO: ${{ secrets.SGI_EMPRESA_CASA_ADUBO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.loja }}" ]; then
            ARGS="$ARGS --loja \"${{ github.event.inputs.loja }}\""
          fi
          if [ -n "${{ github.event.inputs.data }}" ]; then
            ARGS="$ARGS --data \"${{ github.event.inputs.data }}\""
          fi
          if [ -n "${{ github.event.inputs.data_fim }}" ]; then
            ARGS="$ARGS --data-fim \"${{ github.event.inputs.data_fim }}\""
          fi
          eval python scripts/sync_sgi.py $ARGS

      - name: Guardar screenshots/HTML de depuração (se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sync-sgi-${{ github.run_id }}
          path: |
            debug_*.png
            debug_*.html
            debug_*.pdf
          if-no-files-found: ignore
          retention-days: 7