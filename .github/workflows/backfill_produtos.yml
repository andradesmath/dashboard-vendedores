name: Backfill histórico - Vendas por Produto

# Só roda quando disparado manualmente (aba Actions do repositório) — é uma
# importação histórica de UMA VEZ (set/2025 até hoje), não faz parte da
# sincronização automática de 12h/19h (essa continua em sync_sgi.yml).
on:
  workflow_dispatch:
    inputs:
      loja:
        description: "Rodar só uma loja (deixe em branco para todas as configuradas)"
        required: false
        type: choice
        options:
          - ""
          - "Porteira"
          - "Casa de Adubo"
      ano:
        description: "Ano inicial do período a reprocessar DIA A DIA (deixe em branco pra rodar o histórico completo: set/2025 até hoje)"
        required: false
        type: string
      mes:
        description: "Mês inicial, 1-12 (usar junto com 'ano')"
        required: false
        type: string
      ano_fim:
        description: "Ano final do período (deixe em branco = igual ao ano inicial, ou seja, só um mês)"
        required: false
        type: string
      mes_fim:
        description: "Mês final, 1-12 (deixe em branco = igual ao mês inicial)"
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Sem ano/mes: dezenas de relatórios por loja (11 meses + os dias do mês corrente).
    # Com ano/mes (e principalmente com um período de vários meses via ano_fim/mes_fim),
    # roda DIA A DIA — pode ser bem mais demorado ainda (1 relatório por dia por loja).
    # 340min fica dentro do teto de 360min (6h) dos runners hospedados do GitHub.
    timeout-minutes: 340
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements-sync.txt
          playwright install --with-deps chromium

      - name: Rodar backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SGI_URL_LOGIN: ${{ secrets.SGI_URL_LOGIN }}
          SGI_LOGIN: ${{ secrets.SGI_LOGIN }}
          SGI_SENHA: ${{ secrets.SGI_SENHA }}
          SGI_EMPRESA_PORTEIRA: ${{ secrets.SGI_EMPRESA_PORTEIRA }}
          SGI_EMPRESA_CASA_ADUBO: ${{ secrets.SGI_EMPRESA_CASA_ADUBO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.loja }}" ]; then
            ARGS="$ARGS --loja \"${{ github.event.inputs.loja }}\""
          fi
          if [ -n "${{ github.event.inputs.ano }}" ] && [ -n "${{ github.event.inputs.mes }}" ]; then
            ARGS="$ARGS --ano ${{ github.event.inputs.ano }} --mes ${{ github.event.inputs.mes }}"
            if [ -n "${{ github.event.inputs.ano_fim }}" ]; then
              ARGS="$ARGS --ano-fim ${{ github.event.inputs.ano_fim }}"
            fi
            if [ -n "${{ github.event.inputs.mes_fim }}" ]; then
              ARGS="$ARGS --mes-fim ${{ github.event.inputs.mes_fim }}"
            fi
          fi
          eval python scripts/backfill_produtos.py $ARGS

      - name: Guardar screenshots/HTML de depuração (se algo falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-backfill-produtos-${{ github.run_id }}
          path: |
            debug_*.png
            debug_*.html
            debug_*.pdf
          if-no-files-found: ignore
          retention-days: 7